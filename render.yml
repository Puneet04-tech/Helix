services:
  - type: web
    name: helix-api
    # Initial setup for Render
    # Using the backend directory as the source for this service
    env: node
    plan: starter
    region: oregon
    
    # Using direct TypeScript execution to bypass 'dist' missing issues
    # This is a robust fallback for the Render Hobby/Starter tiers
    rootDir: backend
    
    buildCommand: npm install && npx playwright install chromium --with-deps && npm run build
    startCommand: npm run start:prod
    
    # Auto-deploy
    autoDeploy: true
    branch: main
    
    # Port
    port: 5000
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400 --optimize-for-size --gc-interval=100"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LOG_LEVEL
        value: info
      
      # Database - Use MongoDB Atlas (set via dashboard)
      - key: MONGODB_URI
        sync: false
      
      # Authentication (set via dashboard)
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "24h"
      
      # Gemini AI (set via dashboard)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      
      # Mistral AI (set via dashboard)
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      
      # HuggingFace (optional, set via dashboard)
      - key: HUGGINGFACE_API_KEY
        sync: false
