services:
  - type: web
    name: helix-api
    # Initial setup for Render
    # Using the backend directory as the source for this service
    env: node
    plan: starter
    region: oregon
    
    # Consolidating build to ensure dist is generated in the correct context
    # and preventing potential cache/layer issues with nested 'cd'
    buildCommand: npm install --prefix backend && npm run build --prefix backend
    startCommand: node backend/dist/main.js
    
    # Auto-deploy
    autoDeploy: true
    branch: main
    
    # Port
    port: 3000
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400 --optimize-for-size --gc-interval=100"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LOG_LEVEL
        value: info
      
      # Database - Use MongoDB Atlas (set via dashboard)
      - key: MONGODB_URI
        sync: false
      
      # Authentication (set via dashboard)
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "24h"
      
      # Groq AI (set via dashboard)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      
      # HuggingFace (optional, set via dashboard)
      - key: HUGGINGFACE_API_KEY
        sync: false
