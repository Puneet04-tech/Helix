# Netlify Configuration for Helix Frontend

[build]
publish = ".next"
command = "npm install && npm run build"
base = "frontend"

[build.environment]
NODE_VERSION = "22.22.0"
NODE_ENV = "production"
NODE_OPTIONS = "--max_old_space_size=4096"
NEXT_PUBLIC_API_URL = "https://helix-ujly.onrender.com"
NEXT_PUBLIC_WS_URL = "https://helix-ujly.onrender.com"
NEXT_PUBLIC_WS_PATH = "/socket.io"

[[redirects]]
from = "/api/*"
to = "https://helix-ujly.onrender.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/socket.io/*"
to = "https://helix-ujly.onrender.com/socket.io/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[plugins]]
package = "@netlify/plugin-nextjs"
