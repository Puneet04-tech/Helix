# Netlify Configuration for Helix Frontend

[build]
# Directory to deploy (relative to root)
publish = "frontend/.next"

# Build command
command = "cd frontend && npm run build"

# Base directory where Netlify starts
base = "."

# Ignore build command for certain branches
ignore = "git diff --quiet $COMMIT_PARENT $COMMIT -- frontend/ api/ package.json"

[build.environment]
# Node version
NODE_VERSION = "22.22.0"

# Build time environment
NODE_ENV = "production"

# Increase memory for builds
NODE_OPTIONS = "--max_old_space_size=4096"

# Build variables (can be overridden in Netlify UI)
NEXT_PUBLIC_API_URL = "https://helix-ujly.onrender.com"
NEXT_PUBLIC_WS_URL = "https://helix-ujly.onrender.com"
NEXT_PUBLIC_WS_PATH = "/socket.io"

# ==========================================
# Redirects & Rewrites
# ==========================================

# Rewrite for SPA (Single Page App)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
condition = { Status = 404, not = { path = "/api/*" } }

# API proxy to backend
[[redirects]]
from = "/api/*"
to = "https://helix-ujly.onrender.com/api/:splat"
status = 200
force = true

# WebSocket upgrade
[[redirects]]
from = "/socket.io/*"
to = "https://your-render-domain.onrender.com/socket.io/:splat"
status = 200
force = true

# ==========================================
# Headers
# ==========================================

# Security headers
[[headers]]
for = "/*"
[headers.values]
# Prevent clickjacking
X-Frame-Options = "SAMEORIGIN"
# Prevent MIME type sniffing
X-Content-Type-Options = "nosniff"
# Enable XSS protection
X-XSS-Protection = "1; mode=block"
# Referrer policy
Referrer-Policy = "strict-origin-when-cross-origin"
# Content Security Policy
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self';"

# Cache control for static assets
[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Cache control for HTML files (no cache)
[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# ==========================================
# Context: Production
# ==========================================

[context.production]
command = "cd frontend && npm run build"
environment = { NEXT_PUBLIC_API_URL = "https://your-render-domain.onrender.com", NEXT_PUBLIC_WS_URL = "wss://your-render-domain.onrender.com" }

# ==========================================
# Context: Preview (Pull Requests)
# ==========================================

[context.deploy-preview]
command = "cd frontend && npm run build"
environment = { NEXT_PUBLIC_API_URL = "https://your-render-domain.onrender.com", NEXT_PUBLIC_WS_URL = "wss://your-render-domain.onrender.com" }

# ==========================================
# Context: Branch Deploy
# ==========================================

[context.branch-deploy]
command = "cd frontend && npm run build"
environment = { NEXT_PUBLIC_API_URL = "https://your-render-domain.onrender.com", NEXT_PUBLIC_WS_URL = "wss://your-render-domain.onrender.com" }

# ==========================================
# Plugins
# ==========================================

# Cache Next.js artifacts
[[plugins]]
package = "@netlify/plugin-nextjs"

# Optional: Performance monitoring
# [[plugins]]
# package = "netlify-plugin-lighthouse"

# ==========================================
# Functions
# ==========================================

# Edge functions directory
functions = "netlify/functions"
